[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-mobile"
version = "0.1.0"
description = "Goal-driven mobile automation with Jev and Maestro"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Doğukaan Kılıçarslan"}]
dependencies = ["httpx>=0.27,<1", "mcp>=1.12,<2", "PyYAML>=6,<7"]

[project.scripts]
jev-mobile = "jev_mobile.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
